<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3.CSS3단위</title>
    <style>
        /*2. %단위 적용하기
        참고>> 순서 바꾼 이유:
        p:nth-child(1){}
        p:nth-child(2){font-size: 100%;}
        p:nth-child(3){font-size: 150%;}
        p:nth-child(4){font-size: 200%;}*/

        /*p
        :nth-child(1){}
        p:nth-child(2){font-size: 1.0em;}
        p:nth-child(3){font-size: 1.5em;}
        p:nth-child(4){font-size: 2.0em;}*/

        p:nth-child(1){}
        p:nth-child(2){font-size: 16px;}
        p:nth-child(3){font-size: 24px;}
        p:nth-child(4){font-size: 32px;}
        /*색상 단위*/
        h1{background-color: rgb(255,255,0);}
        /*RGBA색상: 알파값은 투명도.0완전투명 1,0완전 불투명 상태*/
        h2{background-color: rgba(255,0,0,0.5);}
        /*HEX코드: RGB색상 단위를 짧게 입력하는 방법 RGB색상조합을000000같은 16진수로 입력합니다.*/
        h3{background-color: #0094ff;}

    </style>
</head>
